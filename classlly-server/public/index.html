<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classlly API Server</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #0f1115;
        color: #ffffff;
        text-align: center;
      }
      .container {
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      h1 {
        margin-bottom: 0.5rem;
        color: #7c4dff;
      }
      p {
        color: #a1a1aa;
      }
      .status {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        background: rgba(34, 197, 94, 0.1);
        color: #22c55e;
        font-weight: bold;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Classlly Server</h1>
      <p>The academic calendar API is running.</p>
      <div class="status">● System Operational</div>
    </div>
  </body>
</html>
